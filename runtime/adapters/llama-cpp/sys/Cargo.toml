[package]
name = "oid-llama-cpp-sys"
description = "Direct, opt-in FFI boundary for the official llama.cpp C API."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
build = "build.rs"

[dependencies]
oid-model-runner = { path = "../../../../crates/model-runner" }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png"] }

[lints.rust]
unsafe_code = "allow"
missing_debug_implementations = "warn"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
