name: Marina Linux native qualification

on:
  workflow_dispatch:
    inputs:
      model_url:
        description: Public HTTPS URL for a small GGUF model; do not upload it to GitHub
        required: true
        type: string
      model_sha256:
        description: SHA-256 checksum for the GGUF model
        required: true
        type: string
      model_id:
        description: Marina model identifier
        required: true
        default: qwen2.5-0.5b-instruct-q4_k_m
        type: string

permissions:
  contents: read

env:
  LLAMA_CPP_COMMIT: 18443257a30c884d5332abb8e7dc43c7ffe42fda

jobs:
  qualify:
    name: Native Linux x86_64 qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake build-essential curl python3
      - name: Build pinned portable llama.cpp
        env:
          LLAMA_CPP_INSTALL_DIR: ${{ runner.temp }}/native
        run: ./scripts/setup-llama-linux.sh
      - name: Build Marina and OID client
        env:
          LLAMA_CPP_LIB_DIR: ${{ runner.temp }}/native
          LLAMA_CPP_REQUIRED: "1"
        run: |
          cargo build --release -p oid-console --bin marina --bin marinactl --bin oid-marina-chat
          mkdir -p "$RUNNER_TEMP/marina/bin" "$RUNNER_TEMP/marina/lib"
          cp target/release/marina target/release/marinactl target/release/oid-marina-chat "$RUNNER_TEMP/marina/bin/"
          cp "$RUNNER_TEMP"/native/libllama.so* "$RUNNER_TEMP/marina/lib/"
          cp "$RUNNER_TEMP"/native/libggml*.so* "$RUNNER_TEMP/marina/lib/"
          ldd "$RUNNER_TEMP/marina/bin/marina" | tee "$RUNNER_TEMP/marina-ldd.txt"
      - name: Download and verify GGUF
        env:
          MODEL_URL: ${{ inputs.model_url }}
          MODEL_SHA256: ${{ inputs.model_sha256 }}
        run: |
          mkdir -p "$RUNNER_TEMP/marina-home/.marina/models"
          curl --fail --location --silent --show-error "$MODEL_URL" \
            -o "$RUNNER_TEMP/marina-home/.marina/models/${{ inputs.model_id }}.gguf"
          printf '%s  %s\n' "$MODEL_SHA256" "$RUNNER_TEMP/marina-home/.marina/models/${{ inputs.model_id }}.gguf" | sha256sum -c -
      - name: Start Marina and qualify native runtime
        env:
          HOME: ${{ runner.temp }}/marina-home
          MARINA_HOME: ${{ runner.temp }}/marina-home
          MARINA_STATE_DIR: ${{ runner.temp }}/marina-home/.marina
          MARINA_MODEL_DIR: ${{ runner.temp }}/marina-home/.marina/models
          MARINA_HTTP_ADDR: 127.0.0.1:11434
          MARINA_URL: http://127.0.0.1:11434
          MARINA_HTTP_AUTH: "true"
          LLAMA_CPP_LIB_DIR: ${{ runner.temp }}/marina/lib
          LLAMA_CPP_REQUIRED: "1"
          LLAMA_CPP_COMMIT: 18443257a30c884d5332abb8e7dc43c7ffe42fda
          MARINA_MODEL: ${{ inputs.model_id }}
          MARINA_MODEL_SHA256: ${{ inputs.model_sha256 }}
          MARINA_BINARY: ${{ runner.temp }}/marina/bin/marina
          MARINA_SOCKET: ${{ runner.temp }}/marina-home/.marina/marina.sock
          QUALIFY_REPORT: ${{ runner.temp }}/linux-qualification.json
        run: |
          export PATH="$RUNNER_TEMP/marina/bin:$PATH"
          export LD_LIBRARY_PATH="$RUNNER_TEMP/marina/lib"
          TOKEN="$(marinactl auth token create ci --scopes=models:read,inference,inference:cancel:self)"
          export MARINA_TOKEN="$TOKEN"
          marina >"$RUNNER_TEMP/marina.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/marina.pid"
          trap 'kill "$(cat "$RUNNER_TEMP/marina.pid")" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:11434/healthz >/dev/null && break
            sleep 1
          done
          marinactl model load "$MARINA_MODEL"
          export MARINACTL="$RUNNER_TEMP/marina/bin/marinactl"
          ./scripts/qualify-marina-linux.sh
          OID_MARINA_URL=http://127.0.0.1:11434 OID_MARINA_TOKEN="$MARINA_TOKEN" OID_MARINA_MODEL="$MARINA_MODEL" \
            "$RUNNER_TEMP/marina/bin/oid-marina-chat" "Reply with exactly QUALIFIED"
          ldd "$RUNNER_TEMP/marina/bin/marina" >"$RUNNER_TEMP/marina-ldd-final.txt"
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marina-linux-qualification
          path: |
            ${{ runner.temp }}/linux-qualification.json
            ${{ runner.temp }}/marina.log
            ${{ runner.temp }}/marina-ldd.txt
            ${{ runner.temp }}/marina-ldd-final.txt
