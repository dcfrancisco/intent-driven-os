name: Talvik release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  LLAMA_CPP_COMMIT: 18443257a30c884d5332abb8e7dc43c7ffe42fda

jobs:
  check:
    name: Workspace checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.82.0
          components: rustfmt, clippy
      - name: Check
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --workspace --exclude oid-console
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings -A clippy::module_name_repetitions

  build:
    name: Build ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: talvik-linux-x86_64.tar.gz
            shell: bash
          - name: macos-intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            archive: talvik-macos-intel.tar.gz
            shell: bash
          - name: macos-apple-silicon
            os: macos-15
            target: aarch64-apple-darwin
            archive: talvik-macos-apple-silicon.tar.gz
            shell: bash
          - name: windows-x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            archive: talvik-windows-x86_64.zip
            shell: pwsh
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.82.0
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: lukka/get-cmake@v3.31.6
      - name: Checkout llama.cpp
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          git -C "$RUNNER_TEMP/llama.cpp" fetch --depth 1 origin "$env:LLAMA_CPP_COMMIT"
          git -C "$RUNNER_TEMP/llama.cpp" checkout --detach "$env:LLAMA_CPP_COMMIT"
        if: runner.os == 'Windows'
      - name: Checkout llama.cpp (Unix)
        if: runner.os != 'Windows'
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          git -C "$RUNNER_TEMP/llama.cpp" fetch --depth 1 origin "$LLAMA_CPP_COMMIT"
          git -C "$RUNNER_TEMP/llama.cpp" checkout --detach "$LLAMA_CPP_COMMIT"
      - name: Configure llama.cpp
        run: >-
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/llama-build"
          -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DGGML_METAL=OFF
          -DGGML_BLAS=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF
          -DLLAMA_BUILD_COMMON=OFF -DLLAMA_BUILD_TOOLS=OFF -DLLAMA_BUILD_MTMD=ON
          -DMTMD_VIDEO=OFF -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Enable Apple BLAS for macOS CPU prompt processing
        if: runner.os == 'macOS'
        run: >-
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/llama-build"
          -DGGML_BLAS=ON -DGGML_BLAS_VENDOR=Apple
      - name: Build llama.cpp and vision library
        run: cmake --build "$RUNNER_TEMP/llama-build" --config Release --target llama mtmd --parallel 2
      - name: Collect native libraries (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p "$RUNNER_TEMP/talvik/lib"
          find "$RUNNER_TEMP/llama-build" \( -type f -o -type l \) \( -name 'libllama.*' -o -name 'libggml*.*' -o -name 'libmtmd.*' \) -exec cp -a {} "$RUNNER_TEMP/talvik/lib" \;
          test -n "$(find "$RUNNER_TEMP/talvik/lib" -maxdepth 1 -type f -name 'libllama.*' -print -quit)"
          test -n "$(find "$RUNNER_TEMP/talvik/lib" -maxdepth 1 -type f -name 'libmtmd.*' -print -quit)"
      - name: Collect native libraries (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/talvik/lib" | Out-Null
          Get-ChildItem -Path "$env:RUNNER_TEMP/llama-build" -Recurse -File -Include llama.lib,ggml*.lib,mtmd.lib,llama.dll,ggml*.dll,mtmd.dll | Copy-Item -Destination "$env:RUNNER_TEMP/talvik/lib"
          if (-not (Get-ChildItem -Path "$env:RUNNER_TEMP/talvik/lib" -Filter "llama.dll" -File)) { throw "llama.dll was not produced" }
      - name: Build Talvik (Unix)
        if: runner.os != 'Windows'
        run: |
          LLAMA_CPP_LIB_DIR="$RUNNER_TEMP/talvik/lib" LLAMA_CPP_REQUIRED=1 LLAMA_CPP_MTMD_REQUIRED=1 cargo install --path console --root "$RUNNER_TEMP/talvik" --locked --force --bin talvik --bin talvikd
      - name: Build Talvik (Windows)
        if: runner.os == 'Windows'
        run: |
          $env:LLAMA_CPP_LIB_DIR = "$env:RUNNER_TEMP/talvik/lib"
          $env:LLAMA_CPP_REQUIRED = "1"
          $env:LLAMA_CPP_MTMD_REQUIRED = "1"
          cargo install --path console --root "$env:RUNNER_TEMP/talvik" --locked --force --bin talvik --bin talvikd
      - name: Package Unix
        if: runner.os != 'Windows'
        run: |
          cp scripts/install-model-runner.sh "$RUNNER_TEMP/talvik/"
          cp scripts/install-talvik-macos.sh "$RUNNER_TEMP/talvik/" 2>/dev/null || true
          cp packaging/talvik/talvikd.plist.in "$RUNNER_TEMP/talvik/" 2>/dev/null || true
          cp LICENSE "$RUNNER_TEMP/talvik/" 2>/dev/null || true
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/${{ matrix.archive }}" talvik
          shasum -a 256 "$RUNNER_TEMP/${{ matrix.archive }}" > "$RUNNER_TEMP/${{ matrix.archive }}.sha256"
      - name: Package Windows
        if: runner.os == 'Windows'
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere)) { throw "vswhere.exe was not found: $vswhere" }
          $vsPath = & $vswhere -latest -products "*" -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vsPath) { throw "Visual Studio installation was not found" }
          $redistRoot = Join-Path $vsPath "VC\Redist\MSVC"
          $crtPath = Get-ChildItem -LiteralPath $redistRoot -Directory |
            Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object { Join-Path $_.FullName "x64\Microsoft.VC143.CRT" } |
            Where-Object { Test-Path -LiteralPath $_ } |
            Select-Object -First 1
          if (-not $crtPath) { throw "The x64 Microsoft Visual C++ runtime redistributable was not found under $redistRoot" }
          Get-ChildItem -LiteralPath $crtPath -Filter "*.dll" -File | Copy-Item -Destination "$env:RUNNER_TEMP/talvik/lib" -Force
          Get-ChildItem -Path "$env:RUNNER_TEMP/talvik/lib" -Filter "*.dll" -File | Copy-Item -Destination "$env:RUNNER_TEMP/talvik/bin" -Force
          if (Test-Path LICENSE) { Copy-Item LICENSE "$env:RUNNER_TEMP/talvik/" }
          Copy-Item scripts/install-model-runner.ps1 "$env:RUNNER_TEMP/talvik/"
          Copy-Item packaging/talvik/README-WINDOWS.txt "$env:RUNNER_TEMP/talvik/"
          Copy-Item packaging/talvik/SETUP-WINDOWS.cmd "$env:RUNNER_TEMP/talvik/"
          Compress-Archive -Path "$env:RUNNER_TEMP/talvik/*" -DestinationPath "$env:RUNNER_TEMP/${{ matrix.archive }}"
          (Get-FileHash "$env:RUNNER_TEMP/${{ matrix.archive }}" -Algorithm SHA256).Hash.ToLower() + "  ${{ matrix.archive }}" | Out-File "$env:RUNNER_TEMP/${{ matrix.archive }}.sha256"
      - name: Smoke install Unix payload
        if: runner.os != 'Windows'
        run: ./scripts/smoke-release-install.sh "$RUNNER_TEMP/${{ matrix.archive }}"
      - name: Smoke install Windows payload
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-release-install.ps1 -ArchivePath "$env:RUNNER_TEMP/${{ matrix.archive }}"
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ runner.temp }}/${{ matrix.archive }}
            ${{ runner.temp }}/${{ matrix.archive }}.sha256

  packages:
    name: Linux DEB and RPM packages
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/download-artifact@v4.3.0
        with:
          name: linux-x86_64
          path: release
      - name: Install RPM tooling
        run: sudo apt-get update && sudo apt-get install --yes rpm
      - name: Build packages
        run: |
          set -euo pipefail
          archive="$(find release -maxdepth 1 -name 'talvik-linux-x86_64.tar.gz' -print -quit)"
          test -n "$archive"
          work="$RUNNER_TEMP/talvik-package"
          mkdir -p "$work"
          tar -xzf "$archive" -C "$work"
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" == "$GITHUB_REF_NAME" || ! "$version" =~ ^[0-9]+(\.[0-9]+){2}([.-][0-9A-Za-z.-]+)?$ ]]; then
            version="0.1.0"
          fi
          bash scripts/package-talvik-deb.sh \
            --version "$version" \
            --talvikd "$work/talvik/bin/talvikd" \
            --talvik "$work/talvik/bin/talvik" \
            --native-lib-dir "$work/talvik/lib" \
            --output "$RUNNER_TEMP/talvik_${version}_amd64.deb"
          bash scripts/package-talvik-rpm.sh \
            --version "$version" \
            --talvikd "$work/talvik/bin/talvikd" \
            --talvik "$work/talvik/bin/talvik" \
            --native-lib-dir "$work/talvik/lib" \
            --output-dir "$RUNNER_TEMP/packages"
          mkdir -p release
          cp "$RUNNER_TEMP/talvik_${version}_amd64.deb" release/
          cp "$RUNNER_TEMP/packages"/talvik-*.rpm release/
          (cd release && sha256sum talvik-*.deb talvik-*.rpm > checksums.sha256)
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: linux-packages
          path: release/*

  release:
    name: Draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, packages]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          path: artifacts
      - name: Publish draft release
        uses: softprops/action-gh-release@v2.3.2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
