[package]
name = "oid-console"
description = "Phase 1 keyboard-first AI Console foundation."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
build = "build.rs"
autobins = false

[[bin]]
name = "oid-console"
path = "src/main.rs"

[[bin]]
name = "talvik"
path = "src/bin/talvik.rs"

[[bin]]
name = "talvikd"
path = "src/bin/talvikd.rs"

[[bin]]
name = "oid-marina-chat"
path = "src/bin/oid-marina-chat.rs"

[dependencies]
oid-runtime = { path = "../runtime" }
oid-model-client = { path = "../crates/model-client" }
oid-shared = { path = "../shared" }
oid-common = { path = "../crates/common" }
oid-intent-runtime = { path = "../crates/intent-runtime" }
oid-linux-skills = { path = "../crates/linux-skills" }
oid-policy-engine = { path = "../crates/policy-engine" }
oid-verification-engine = { path = "../crates/verification-engine" }
oid-evidence-engine = { path = "../crates/evidence-engine" }
oid-operation-coordinator = { path = "../crates/operation-coordinator" }
signal-hook = "0.3"
serde_json = "1"
base64 = "0.22"
crossterm = "=0.28.1"
unicode-width = "=0.2.0"

[lints]
workspace = true
